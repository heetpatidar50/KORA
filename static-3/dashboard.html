<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#713D2B" />
  <title>Dashboard · KORA</title>
  <link rel="icon" href="images/kora-logo.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/liquid.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="aqua" aria-hidden="true"><span class="aqua__blob aqua__blob--1"></span><span class="aqua__blob aqua__blob--2"></span><span class="aqua__blob aqua__blob--3"></span></div>

  <header class="dash-top">
    <a href="index.html" class="brand">
      <span class="brand__mark"><svg viewBox="0 0 48 48" width="30" height="30"><circle cx="24" cy="24" r="22" fill="#fbf4e4"/><path d="M4 30c7 5 13 5 20 1s13-4 20 1v12H4Z" fill="#c9a227"/><path d="M24 26c0-6 4-9 10-10-1 7-4 10-10 10Z" fill="#713D2B"/><path d="M24 26c0-5-3-8-8-9 1 6 3 8 8 9Z" fill="#8a5636"/><path d="M24 30V16" stroke="#713D2B" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span class="brand__name">KORA</span>
    </a>
    <div class="spacer"></div>
    <div class="dash-user">
      <label class="lang"><select data-lang-select aria-label="Language"><option value="en">English</option><option value="hi">हिंदी</option><option value="te">తెలుగు</option><option value="ta">தமிழ்</option><option value="gu">ગુજરાતી</option><option value="mr">मराठी</option><option value="pa">ਪੰਜਾਬੀ</option></select></label>
      <span id="whoName">—</span>
      <span class="role-badge" id="whoRole">—</span>
      <a href="#" class="btn btn--line btn--xs" id="logout">Log out</a>
    </div>
  </header>

  <main class="dash-wrap" id="dash">
    <h1 class="dash-hello" id="dashHello">Welcome</h1>
    <p class="dash-sub" id="dashSub">Loading your workspace…</p>
    <div class="stat-row" id="stats"></div>
    <div id="panels"></div>
  </main>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/local-api.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
